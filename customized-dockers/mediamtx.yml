logLevel: info
rtmp: true
hls: true
webrtc: false
rtsp: false
srt: false
# MoQ ships enabled upstream (v1.20+) and would open :8892/:8893 and generate
# auto.key/auto.crt in the working dir. We only serve RTMP + HLS.
moq: false
api: true
logDestinations: [stdout, file]
logFile: /mediamtx.log
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889
hlsCDNSecret: rXi410Xfd@4DMxwE1gz1BhSI1Ot7aJOI

# [ARENA / JAVA] Hybrid authentication (fork option authHTTPActions).
#   publish             -> HTTP call to Java (authHTTPAddress), synchronous,
#                          BEFORE the stream goes live. Java checks the JWT,
#                          stream_key ownership (HMAC) and that the live is
#                          not ENDED, then replies 200 {"user","jti"} or 401.
#   read / playback     -> JWT verified locally with the JWKS (CPU only,
#                          Java is never called; viewer traffic is the bulk).
#   api (/v3, :9997)    -> JWT with an "api" permission, signed by Java for
#                          itself (list / kick). Users never get it.
# Design: livestream-arena/docs/designs/0001-live-auth-hybrid.md
#
# Path = <live_server_id>/<stream_key>, stream_key = nonce(8) + mac(11) + mode(1):
#   mode 1 (last char "1") -> public viewing, no JWT
#   mode 2..9              -> viewing needs a JWT issued by Java
#
# Deploy order: Java (token + auth endpoints) first, then this config, then
# the app (new stream keys). Old UUID paths are rejected by the paths regex.
# NOTE: env vars override this file (MTX_AUTHJWTJWKS, MTX_AUTHHTTPADDRESS, ...).
authMethod: jwt
authJWTJWKS: http://CHANGE-ME-java/internal/authorization/jwks.json
authJWTClaimKey: arena_livestream_permissions
authJWTIssuer: livestream-service
authJWTAudience: mediamtx-servers
# The HLS player sends ?jwt=... in the URL. Deprecated upstream: re-check on
# every rebase (if removed, the app must send "Authorization: Bearer").
authJWTInHTTPQuery: true

authHTTPActions: [publish]
authHTTPAddress: http://CHANGE-ME-java/internal/mediamtx/auth
authHTTPExclude: []

# Permissions that skip the JWT check. Only mode-1 viewing is free.
# There is NO "action: publish" (publish always goes to Java) and NO
# "action: api" (the admin API always needs a JWT).
# go-rest-service reads HLS for thumbnails with
# "Authorization: Bearer <hlsCDNSecret>" (treated as a CDN request, no auth).
authJWTExclude:
  - action: read
    path: ~^live[0-9a-zA-Z]+/[0-9A-Za-z]{19}1$
  - action: playback
    path: ~^live[0-9a-zA-Z]+/[0-9A-Za-z]{19}1$

paths:
  # Only well-formed stream keys get a path config; anything else is rejected.
  ~^live[0-9a-zA-Z]+/[0-9A-Za-z]{19}[1-9]$:
    source: publisher
    record: yes
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordPartDuration: 10s
    recordSegmentDuration: 10s
    recordDeleteAfter: 30d
    # mpegts, not fmp4: the iOS Flutter player cannot play fragmented MP4.
    recordFormat: mpegts

    # runOnOnline/runOnOffline fire when a real publisher starts/stops feeding
    # the path. They replace the deprecated runOnReady/runOnNotReady.
    #
    # Upstream split the old "ready" state in two because of alwaysAvailable
    # mode (an offline placeholder segment loops while nobody is publishing):
    #   available = readable, possibly only the placeholder -> runOnAvailable
    #   online    = a real source is feeding it             -> runOnOnline
    # With alwaysAvailable off (our case) both fire at the same moment, so
    # runOnOnline keeps the exact STREAM_START/STREAM_STOP timing we had and
    # stays correct if alwaysAvailable is ever turned on.
    #
    # MTX_USER (JWT sub) and MTX_JTI (JWT id) are fork additions: for publish
    # they are the "user"/"jti" returned by the Java auth call, see
    # internal/hooks/on_online.go. MTX_PATH = <live_server_id>/<stream_key>.
    runOnOnline: /bin/sh /scripts/send-kafka.sh STREAM_START "$MTX_PATH" "$MTX_QUERY" "$MTX_USER" "$MTX_JTI" "$MTX_SOURCE_TYPE" "$MTX_SOURCE_ID"
    runOnOffline: /bin/sh /scripts/send-kafka.sh "STREAM_STOP" "$MTX_PATH"

    runOnRecordSegmentComplete: /bin/sh /scripts/warm-up-cdn.sh "$MTX_PATH" "$MTX_SEGMENT_PATH"

    # Viewer tracking. MTX_USER/MTX_JTI come from the viewer JWT (sub/jti); they
    # are empty for mode-1 (public) lives, which need no token.
    runOnRead: /bin/sh /scripts/send-kafka.sh STREAM_VIEW_START "$MTX_PATH" "$MTX_QUERY" "$MTX_USER" "$MTX_JTI" "$MTX_READER_TYPE" "$MTX_READER_ID"
    runOnUnread: /bin/sh /scripts/send-kafka.sh STREAM_VIEW_STOP "$MTX_PATH" "$MTX_USER" "$MTX_JTI" "$MTX_READER_ID"
